server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad globales
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://localhost:8000 https://miturno.alejomonardez.com; connect-src 'self' http://localhost:8000 https://miturno.alejomonardez.com;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # index.html nunca se cachea para que el navegador siempre cargue el bundle más reciente
    location = /index.html {
        try_files $uri /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;

        # Cabeceras de seguridad (repetidas por override de add_header en location)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://localhost:8000 https://miturno.alejomonardez.com; connect-src 'self' http://localhost:8000 https://miturno.alejomonardez.com;" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Assets con hash (JS/CSS) — se cachean de forma permanente
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";

        # Cabeceras de seguridad (repetidas por override de add_header en location)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://localhost:8000 https://miturno.alejomonardez.com; connect-src 'self' http://localhost:8000 https://miturno.alejomonardez.com;" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # React Router — redirigir todo al index.html
    location / {
        try_files $uri $uri/ /index.html;
    }


    # Resolver de Docker: permite re-resolver la IP del backend en runtime, así
    # si el contenedor del backend se reconstruye (nueva IP) el proxy no queda
    # apuntando a una IP vieja (evita los 502 "Bad Gateway").
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy API al backend (removiendo el prefijo /api)
    location /api/ {
        set $backend_api backend;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # Proxy para archivos subidos (imágenes de servicios/profesionales)
    location /uploads/ {
        set $backend_up backend;
        proxy_pass http://$backend_up:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
