# /etc/nginx/sites-available/miturno
# Bloque inicial solo HTTP. Certbot --nginx agrega el bloque 443 con SSL y el redirect automáticamente.

server {
    listen 80;
    server_name miturno.alejomonardez.com;

    client_max_body_size 20M;

    # Cabeceras de Seguridad Globales
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Frontend (contenedor en puerto 3000)
    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Evitar duplicidad de cabeceras
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
    }

    # API Backend (contenedor en puerto 8000)
    location ~ ^/(api|auth|negocios|reservas|disponibilidad|servicios|profesionales|admin|super-admin|resenas|portafolio|cancelar|uploads|health)(/|$) {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # Evitar duplicidad de cabeceras
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
    }
}
