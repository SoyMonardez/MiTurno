services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-miturno}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miturno}
      POSTGRES_DB: ${POSTGRES_DB:-miturno}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miturno}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - default

  backend:
    build: ./backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-miturno}:${POSTGRES_PASSWORD:-miturno}@db:5432/${POSTGRES_DB:-miturno}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SECRET_KEY: ${SECRET_KEY:-cambiar-esta-clave-en-produccion}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-MiTurno <no-reply@miturno.local>}
      SMTP_TLS: ${SMTP_TLS:-true}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "alembic upgrade head && (python -m app.seed || true) && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - default

  worker:
    build: ./backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-miturno}:${POSTGRES_PASSWORD:-miturno}@db:5432/${POSTGRES_DB:-miturno}
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-MiTurno <no-reply@miturno.local>}
      SMTP_TLS: ${SMTP_TLS:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    volumes:
      - uploads_data:/app/uploads
    networks:
      - default

  scheduler:
    build: ./backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-miturno}:${POSTGRES_PASSWORD:-miturno}@db:5432/${POSTGRES_DB:-miturno}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    networks:
      - default

  # Gateway de WhatsApp (plan Premium). Se levanta con:
  #   docker compose --profile whatsapp up -d evolution
  # Luego conectar el número escaneando el QR en http://localhost:8080/manager
  # y configurar el webhook hacia http://backend:8000/webhook/whatsapp
  evolution:
    image: atendai/evolution-api:v2.1.1
    restart: always
    profiles: ["whatsapp"]
    ports:
      - "8080:8080"
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-cambiar-esta-clave}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-miturno}:${POSTGRES_PASSWORD:-miturno}@db:5432/evolution?schema=public
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://backend:8000/webhook/whatsapp
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - default

  frontend:
    build:
      context: ./frontend
    restart: always
    depends_on:
      - backend
    networks:
      - default
      - nginx_network

volumes:
  pgdata:
  uploads_data:
  evolution_data:

networks:
  default:
    driver: bridge
  nginx_network:
    external: true
    name: nginx_network
